name: Standby Keepalive & Health Ping

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Standby Health Endpoint
        run: |
          if [ -z "${{ vars.HEALTH_URL }}" ]; then
            echo "::warning ::HEALTH_URL repository variable is not set. Skipping keepalive check."
            exit 0
          fi

          echo "Pinging health endpoint at ${{ vars.HEALTH_URL }}..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" "${{ vars.HEALTH_URL }}")
          
          echo "Response code: $HTTP_STATUS"
          cat response.json || true

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error ::Health check failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Standby instance is healthy and active."
